name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (defaults to triggering commit SHA)
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  AR_LOCATION: ${{ vars.AR_LOCATION }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION }}
  APP_HOST: ${{ vars.APP_HOST }}
  INGRESS_CLASS_NAME: ${{ vars.INGRESS_CLASS_NAME }}
  BACKEND_ALLOWED_ORIGINS: ${{ vars.BACKEND_ALLOWED_ORIGINS }}
  FRONTEND_API_BASE_URL: ${{ vars.FRONTEND_API_BASE_URL }}

jobs:
  deploy-with-helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Resolve source and target image tags
        run: |
          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            echo "SOURCE_IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "SOURCE_IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

          echo "TARGET_IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Validate deploy configuration
        run: |
          required_vars=(GCP_PROJECT_ID AR_LOCATION AR_REPOSITORY GKE_CLUSTER GKE_LOCATION)
          for key in "${required_vars[@]}"; do
            if [[ -z "${!key}" ]]; then
              echo "Missing repository variable: $key"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "$AR_LOCATION-docker.pkg.dev" --quiet

      - name: Retag images to target commit SHA
        run: |
          BACKEND_REPO="$AR_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPOSITORY/assignment-api"
          FRONTEND_REPO="$AR_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPOSITORY/assignment-frontend"

          if [[ "$SOURCE_IMAGE_TAG" != "$TARGET_IMAGE_TAG" ]]; then
            docker pull "$BACKEND_REPO:$SOURCE_IMAGE_TAG"
            docker tag "$BACKEND_REPO:$SOURCE_IMAGE_TAG" "$BACKEND_REPO:$TARGET_IMAGE_TAG"
            docker push "$BACKEND_REPO:$TARGET_IMAGE_TAG"

            docker pull "$FRONTEND_REPO:$SOURCE_IMAGE_TAG"
            docker tag "$FRONTEND_REPO:$SOURCE_IMAGE_TAG" "$FRONTEND_REPO:$TARGET_IMAGE_TAG"
            docker push "$FRONTEND_REPO:$TARGET_IMAGE_TAG"
          fi

          echo "IMAGE_TAG=$TARGET_IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm deploy
        run: |
          APP_HOST_VALUE="${APP_HOST:-}"
          INGRESS_CLASS_VALUE="${INGRESS_CLASS_NAME:-gce}"
          BACKEND_ALLOWED_ORIGINS_VALUE="${BACKEND_ALLOWED_ORIGINS:-}"
          FRONTEND_API_BASE_URL_VALUE="${FRONTEND_API_BASE_URL:-}"
          FRONTEND_API_BASE_URL_NORMALIZED="${FRONTEND_API_BASE_URL_VALUE,,}"
          if [[ -z "$FRONTEND_API_BASE_URL_VALUE" || "$FRONTEND_API_BASE_URL_NORMALIZED" == "app_host" ]]; then
            FRONTEND_API_BASE_URL_VALUE=""
          fi
          helm upgrade --install assignment ./helm/assignment \
            --namespace assignment \
            --create-namespace \
            --values helm/assignment/values-gke.yaml \
            --set backend.image.repository=$AR_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPOSITORY/assignment-api \
            --set backend.image.tag=$IMAGE_TAG \
            --set frontend.image.repository=$AR_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPOSITORY/assignment-frontend \
            --set frontend.image.tag=$IMAGE_TAG \
            --set ingress.host="$APP_HOST_VALUE" \
            --set ingress.className="$INGRESS_CLASS_VALUE" \
            --set backend.allowedOrigins="$BACKEND_ALLOWED_ORIGINS_VALUE" \
            --set frontend.apiBaseUrl="$FRONTEND_API_BASE_URL_VALUE"

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/assignment-backend -n assignment
          kubectl rollout status deployment/assignment-frontend -n assignment
