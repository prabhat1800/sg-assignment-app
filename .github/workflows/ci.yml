name: CI

on:
  pull_request:
    branches: [main, staging, develop]
    types: [opened, reopened, synchronize]
  push:
    branches: [main, staging, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.12"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests-and-security:
    if: >
      (github.event_name == 'push' && contains(fromJSON('["main", "staging", "develop"]'), github.ref_name)) ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Unit tests
        run: pytest -q backend/tests

      - name: Security scan - Python dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Security scan - filesystem (Trivy)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  # sonar-analysis:
  #   if: >
  #     (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
  #     (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/'))
  #   runs-on: ubuntu-latest
  #   needs: backend-tests-and-security
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v5
  #       with:
  #         fetch-depth: 0
  #
  #     - name: SonarCloud analysis
  #       uses: SonarSource/sonarqube-scan-action@v6
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #         SONAR_HOST_URL: https://sonarcloud.io
  #       with:
  #         args: >
  #           -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
  #           -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  build-images:
    if: >
      (github.event_name == 'push' && contains(fromJSON('["main", "staging", "develop"]'), github.ref_name)) ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [backend-tests-and-security, helm-validation]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t assignment-api:ci ./backend

      - name: Build frontend image
        run: docker build -t assignment-frontend:ci ./frontend

      - name: Security scan - backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: assignment-api:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Security scan - frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: assignment-frontend:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  helm-validation:
    if: >
      (github.event_name == 'push' && contains(fromJSON('["main", "staging", "develop"]'), github.ref_name)) ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render ${{ matrix.environment }} chart
        run: |
          helm lint helm/assignment -f helm/assignment/values-${{ matrix.environment }}.yaml
          helm template assignment-${{ matrix.environment }} helm/assignment \
            -f helm/assignment/values-${{ matrix.environment }}.yaml > /tmp/assignment-${{ matrix.environment }}.yaml

  # This job maps each long-lived branch to its target environment and pushes
  # an image tagged with the triggering commit SHA to the matching Artifact
  # Registry repo:
  #   develop -> dev       (assignment-api-dev / assignment-frontend-dev)
  #   staging -> staging   (assignment-api-staging / assignment-frontend-staging)
  #   main    -> prod      (assignment-api-prod / assignment-frontend-prod)
  #
  # NOTE: When manually triggering the CD workflow, select the git ref that
  # matches the target environment (e.g. environment=staging -> select the
  # staging branch). CD pulls an image tagged with the SHA of whichever ref
  # was selected at dispatch time; a mismatched branch/environment pair will
  # fail to pull since that SHA was never pushed under the other repo name.
  push-images-ar:
    if: github.event_name == 'push' && contains(fromJSON('["main", "staging", "develop"]'), github.ref_name)
    runs-on: ubuntu-latest
    needs: [build-images, helm-validation]
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'staging' && 'staging' || 'dev' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'staging' && 'staging' || 'dev' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      AR_LOCATION: ${{ vars.AR_LOCATION }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Artifact Registry configuration
        run: |
          set -euo pipefail

          required_vars=(GCP_PROJECT_ID AR_LOCATION AR_REPOSITORY GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT)
          for key in "${required_vars[@]}"; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required configuration: $key"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${AR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          BACKEND_IMAGE="${AR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/assignment-api-${DEPLOY_ENV}:${IMAGE_TAG}"
          docker build -t "$BACKEND_IMAGE" ./backend
          docker push "$BACKEND_IMAGE"

      - name: Build and push frontend image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          FRONTEND_IMAGE="${AR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/assignment-frontend-${DEPLOY_ENV}:${IMAGE_TAG}"
          docker build -t "$FRONTEND_IMAGE" ./frontend
          docker push "$FRONTEND_IMAGE"