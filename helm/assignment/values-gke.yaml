backend:
  replicaCount: 2
  image:
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  allowedOrigins: ""

frontend:
  replicaCount: 2
  image:
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  apiBaseUrl: ""

ingress:
  enabled: true
  className: "gce"
  host: ""