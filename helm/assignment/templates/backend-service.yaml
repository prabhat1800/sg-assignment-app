apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: assignment-backend
    app.kubernetes.io/environment: {{ .Values.environment | quote }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/name: assignment-backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http