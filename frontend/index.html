<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assignment Task Tracker</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #112240;
      --muted: #47607f;
      --accent: #0b7f6d;
      --accent-hover: #096b5d;
      --border: #d9e2ec;
      --danger: #9f1239;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top right, #e0f2fe, var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(17, 34, 64, 0.08);
      padding: 24px;
    }
    h1 { margin: 0 0 8px 0; }
    p { margin: 0 0 24px 0; color: var(--muted); }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .error {
      min-height: 24px;
      margin: 0 0 12px;
      color: var(--danger);
      font-size: 14px;
    }
    .status {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--border);
    }
    li {
      padding: 12px 6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .id {
      color: var(--muted);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      min-width: 44px;
    }
    .title {
      flex: 1;
    }
    .done {
      text-decoration: line-through;
      color: var(--muted);
    }
    .check {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    @media (max-width: 680px) {
      form { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Assignment Task Tracker</h1>
    <p>Separate frontend app calling backend APIs.</p>

    <form id="task-form">
      <input id="task-title" name="title" maxlength="120" placeholder="Add a task" required />
      <button type="submit">Add</button>
    </form>

    <p class="error" id="error"></p>
    <p class="status" id="status">0/0 completed</p>
    <ul id="task-list"></ul>
  </main>

  <script src="./config.js"></script>
  <script>
    const form = document.getElementById("task-form");
    const titleInput = document.getElementById("task-title");
    const list = document.getElementById("task-list");
    const error = document.getElementById("error");
    const status = document.getElementById("status");
    const configuredApiBase = window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL;
    const apiBase = configuredApiBase && !/app_host/i.test(configuredApiBase) && !/^\/api\/?$/i.test(configuredApiBase)
      ? configuredApiBase.replace(/\/$/, "")
      : "";

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    async function fetchTasks() {
      const res = await fetch(`${apiBase}/api/tasks`);
      if (!res.ok) {
        throw new Error("could not load tasks");
      }
      const data = await res.json();

      const total = data.items.length;
      const completed = data.items.filter((task) => task.completed).length;
      status.textContent = `${completed}/${total} completed`;

      list.innerHTML = data.items
        .map(
          (task) => `<li>
          <span class="id">#${task.id}</span>
          <input class="check" type="checkbox" data-id="${task.id}" ${task.completed ? "checked" : ""} />
          <span class="title ${task.completed ? "done" : ""}">${escapeHtml(task.title)}</span>
        </li>`
        )
        .join("");
    }

    async function createTask(title) {
      const res = await fetch(`${apiBase}/api/tasks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title })
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({ detail: "request failed" }));
        throw new Error(body.detail || "request failed");
      }
    }

    async function setTaskCompletion(taskId, completed) {
      const res = await fetch(`${apiBase}/api/tasks/${taskId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ completed })
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({ detail: "request failed" }));
        throw new Error(body.detail || "request failed");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";

      try {
        await createTask(titleInput.value);
        titleInput.value = "";
        await fetchTasks();
      } catch (err) {
        error.textContent = err.message;
      }
    });

    list.addEventListener("change", async (event) => {
      const target = event.target;

      if (!(target instanceof HTMLInputElement) || !target.classList.contains("check")) {
        return;
      }

      error.textContent = "";

      try {
        const taskId = Number(target.dataset.id);
        await setTaskCompletion(taskId, target.checked);
        await fetchTasks();
      } catch (err) {
        target.checked = !target.checked;
        error.textContent = err.message;
      }
    });

    fetchTasks().catch((err) => {
      error.textContent = err.message;
    });
  </script>
</body>
</html>
